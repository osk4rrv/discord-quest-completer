name: Feature request
description: Suggest an interface, runtime or metadata change.
body:
  - type: textarea
    id: request
    attributes:
      label: Requested behavior
      description: Describe the use case and behavior you want.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Metadata source, if applicable
      description: Link to a source for any suggested executable path or application identity.
