name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $taskVersion = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(QuestCompleter VERSION ([0-9.]+)').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$taskVersion") { throw 'Tag does not match the project version.' }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuestCompleter-Windows-x64
          path: |
            dist/QuestCompleter-Windows-x64.zip
            dist/QuestCompleter-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuestCompleter-Windows-x64
          path: release
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$env:RELEASE_TAG" release/QuestCompleter-Windows-x64.zip release/QuestCompleter-Windows-x64.zip.sha256 --repo "$env:RELEASE_REPOSITORY" --verify-tag --title "Quest Completer $env:RELEASE_TAG" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
